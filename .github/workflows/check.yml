name: Check lane
on:
  workflow_call:
    inputs:
      lane:
        required: true
        type: string
permissions:
  contents: read
jobs:
  check:
    name: ${{ inputs.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Locked public dependencies
        run: nix develop -c composer install --no-interaction --prefer-dist
      - name: Prepare Chromium sandbox
        if: inputs.lane != 'fast' && inputs.lane != 'qualification-foundation' && inputs.lane != 'qualification-final'
        id: chromium_sandbox
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: sh tools/ci/browser-sandbox.sh prepare
      - name: Checks and tests
        env:
          CI_CHECK_LANE: ${{ inputs.lane }}
        run: nix develop -c sh tools/ci/run-check.sh "$CI_CHECK_LANE"
      - name: Secrets in public history
        if: inputs.lane == 'full' || inputs.lane == 'qualification-final'
        run: nix develop -c gitleaks git --log-opts='--all --full-history' --redact=100 --ignore-gitleaks-allow --no-banner .
      - name: Remove job sandbox helper
        if: ${{ always() && steps.chromium_sandbox.outputs.installed == 'true' }}
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: sh tools/ci/browser-sandbox.sh remove
